name: Deploy MK Mock Reports
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mk-mock-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare final reports with same-Level ranking
        run: |
          mkdir -p _site
          unzip -q mock-20261029-2359-final-frontend.zip -d _site
          for archive in mock-20261029-2359-final-pdfs-*.zip; do
            test -f "$archive"
            unzip -q "$archive" -d _site
          done
          python3 verify_deploy.py _site deploy-manifest.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
