name: Deploy MK Mock Reports
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mk-mock-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare independent mock website with course restoration
        run: |
          mkdir -p _site
          unzip -q frontend.zip -d _site
          for archive in pdfs-*.zip; do unzip -q "$archive" -d _site; done
          for archive in promotion-update-*.zip; do
            test -f "$archive"
            unzip -oq "$archive" -d _site
          done
          test -f _site/index.html
          python3 - <<'PY'
          """Validate the public Mock 1 website using only Python's standard library."""
          import argparse
          import collections
          import hashlib
          import json
          import re
          from pathlib import Path
          
          EXPECTED_RECORDS = 194
          EXPECTED_REPORTS = 199
          EXPECTED_AUDIENCE = {('1-2', 'enrolled'): 40, ('1-2', 'new'): 46,
                               ('3-4', 'enrolled'): 36, ('3-4', 'new'): 56,
                               ('5-6', 'enrolled'): 8, ('5-6', 'new'): 13}
          RECORD_KEYS = {'schemaVersion', 'reportType', 'studentNumber', 'reports'}
          REPORT_KEYS = {'diagnosticId', 'level', 'grade', 'gradeLabel', 'actualGrade',
                         'firstName', 'lastName', 'displayName', 'score', 'maximum',
                         'correctQuestionIds', 'wrongQuestionIds', 'date', 'rank',
                         'percentile', 'cohortSize', 'rankingBasis', 'cohortLabel',
                         'cohortGradeStatus', 'smallCohort', 'audience', 'enrollmentStatus',
                         'pdfPath', 'questions', 'moduleOverview'}
          QUESTION_KEYS = {'id', 'points', 'module', 'topic', 'guidance', 'image',
                           'earnedPoints', 'isCorrect'}
          ALLOWED_SUFFIXES = {'', '.css', '.html', '.jpg', '.jpeg', '.js', '.json',
                              '.mjs', '.png', '.svg', '.txt', '.webp', '.pdf'}
          FORBIDDEN_KEYS = re.compile(r'^(?:uid|user.?id|email|e.?mail|phone|mobile|telephone|'
                                      r'contact|contacts|registration|bms|className|classId|'
                                      r'answerKey|correctAnswer|selectedAnswer)$', re.I)
          
          
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          
          def inspect_keys(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      require(not FORBIDDEN_KEYS.fullmatch(key), 'Private field in public JSON')
                      inspect_keys(item)
              elif isinstance(value, list):
                  for item in value:
                      inspect_keys(item)
          
          
          def safe_asset(root, relative):
              require(isinstance(relative, str) and '\\' not in relative, 'Invalid public asset path')
              path = Path(relative)
              require(not path.is_absolute() and '..' not in path.parts, 'Unsafe public asset path')
              target = root / path
              require(target.is_file() and not target.is_symlink(), 'Missing public asset')
              return target
          
          
          def validate(root):
              root = Path(root)
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  require(not path.is_symlink(), 'Symlink in public website')
                  require(path.suffix.lower() in ALLOWED_SUFFIXES, 'Unexpected public file type')
                  require(not any(part.startswith('.') and part != '.nojekyll' for part in relative.parts),
                          'Hidden or private artifact in public website')
                  require(not re.search(r'private|sqlite|node_modules|__pycache__|\.env(?:\.|$)',
                                        str(relative), re.I), 'Private artifact in public website')
              records = sorted((root / 'reports').glob('*.json'))
              require(len(records) == EXPECTED_RECORDS, 'Expected exactly 194 report JSON files')
              audience_counts = collections.Counter()
              expected_pdfs = set()
              new_pdfs = set()
              reports_count = 0
              for path in records:
                  record = json.loads(path.read_text())
                  inspect_keys(record)
                  require(set(record) == RECORD_KEYS, 'Unexpected top-level report fields')
                  require(record['schemaVersion'] == 2 and record['reportType'] == 'mk-mock-report',
                          'Unexpected report schema')
                  number = record['studentNumber']
                  require(isinstance(number, str) and re.fullmatch(r'\d{12}', number), 'Invalid Student Number')
                  token = hashlib.sha256(('mk-mock1:' + number).encode()).hexdigest()[:32]
                  require(path.stem == token, 'Student report filename does not match identity')
                  levels = set()
                  for report in record['reports']:
                      require(set(report) <= REPORT_KEYS, 'Unexpected public report fields')
                      level = report['level']
                      audience = report['audience']
                      require(level in {'1-2', '3-4', '5-6'} and level not in levels, 'Invalid report level')
                      levels.add(level)
                      require({'confirmed-mk': 'enrolled', 'no-confirmed-mk': 'new'}.get(
                          report['enrollmentStatus']) == audience, 'Incorrect audience classification')
                      audience_counts[level, audience] += 1
                      expected_pdf = f'pdfs/{token}-{level}.pdf'
                      require(report['pdfPath'] == expected_pdf, 'Unexpected PDF destination')
                      pdf = safe_asset(root, expected_pdf)
                      require(pdf.read_bytes().startswith(b'%PDF-'), 'Invalid PDF header')
                      require(expected_pdf not in expected_pdfs, 'Duplicate PDF destination')
                      expected_pdfs.add(expected_pdf)
                      if audience == 'new':
                          new_pdfs.add(expected_pdf)
                      total = 30 if level == '5-6' else 24
                      maximum = 120 if level == '5-6' else 96
                      questions = report['questions']
                      require(len(questions) == total and report['maximum'] == maximum, 'Invalid paper size')
                      require({q['id'] for q in questions} == set(range(1, total + 1)), 'Invalid question IDs')
                      correct = set(report['correctQuestionIds'])
                      wrong = set(report['wrongQuestionIds'])
                      require(correct.isdisjoint(wrong) and correct | wrong == set(range(1, total + 1)),
                              'Incomplete question results')
                      require(sum(q['points'] for q in questions if q['id'] in correct) == report['score'],
                              'Question results do not match original score')
                      require(collections.Counter(q['points'] for q in questions) ==
                              {3: total // 3, 4: total // 3, 5: total // 3}, 'Incorrect point-value bands')
                      for question in questions:
                          require(set(question) <= QUESTION_KEYS, 'Unexpected public question fields')
                          if question.get('image'):
                              require(question['image'].startswith(f'assets/level-{level}/'),
                                      'Question image from another level')
                              safe_asset(root, question['image'])
                      reports_count += 1
              require(reports_count == EXPECTED_REPORTS, 'Expected exactly 199 individual reports')
              require(dict(audience_counts) == EXPECTED_AUDIENCE, 'Original audience counts changed')
              actual_pdfs = {str(path.relative_to(root)) for path in (root / 'pdfs').rglob('*.pdf')}
              require(actual_pdfs == expected_pdfs, 'PDF inventory does not exactly match report records')
              manifest = json.loads((root / 'release.json').read_text())
              require((manifest['studentFiles'], manifest['reports'], manifest['pdfFiles']) == (194, 199, 199),
                      'Release metadata does not match verified inventory')
              return {'studentFiles': len(records), 'reports': reports_count, 'pdfFiles': len(actual_pdfs),
                      'newAudienceReports': len(new_pdfs), 'enrolledReports': reports_count - len(new_pdfs),
                      'newPDFPaths': sorted(new_pdfs)}
          import zipfile
          inventory = validate(Path('_site'))
          expected_new_pdfs = set(inventory.pop('newPDFPaths'))
          actual_new_pdfs = []
          for archive in sorted(Path('.').glob('promotion-update-*.zip')):
              with zipfile.ZipFile(archive) as package:
                  actual_new_pdfs.extend(package.namelist())
          require(len(actual_new_pdfs) == 115 and set(actual_new_pdfs) == expected_new_pdfs,
                  'Course restoration must include exactly the 115 prospective-student PDFs')
          print(json.dumps(inventory))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
